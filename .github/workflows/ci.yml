name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-embeddings.txt
            constraints-embeddings-cpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Phase 15 tests exercise the real embedding/runtime modules, so the
          # same CPU-only stack used by the image is installed here. Model
          # weights are not downloaded: tests inject deterministic models.
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.15.0+cpu"
          python -m pip install -r requirements-embeddings.txt

      - name: Ruff
        run: python -m ruff check .

      - name: pytest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

      - name: pip check
        run: python -m pip check

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies for OpenAPI export
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: OpenAPI drift check
        working-directory: frontend
        env:
          OPSPILOT_PYTHON: python
        run: npm run api:check

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_OPSPILOT_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_OPSPILOT_DEV_AUTH: "false"
        run: npm run build

  containers:
    name: Container build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag opspilot-backend:ci \
            .

      - name: Build frontend image
        run: |
          docker build \
            --file frontend/Dockerfile \
            --tag opspilot-frontend:ci \
            --build-arg NEXT_PUBLIC_OPSPILOT_API_URL=http://127.0.0.1:8000 \
            --build-arg NEXT_PUBLIC_OPSPILOT_DEV_AUTH=false \
            frontend
